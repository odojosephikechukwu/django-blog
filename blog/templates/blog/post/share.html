{% extends "blog/base.html" %}

{% block title %}Share a post{% endblock %}

{% block content %}
  
{% if sent %}
  <p>Email successfully sent!</p>
{% else %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send</button>
  </form>
{% endif %}
